# 本地模拟生产环境同域挂载配置（Mac Homebrew Nginx 示例）
# 主项目：http://127.0.0.1:8080/
# 3D项目：http://127.0.0.1:8080/3d/  (同域共享 localStorage)

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    # 1. 3D 项目（/3d/ 路径，strip /3d 前缀转发给 8001）
    location = /3d {
        return 301 /3d/;
    }

    location /3d/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. 主框架项目（根路径 /，转发给 8000）
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
