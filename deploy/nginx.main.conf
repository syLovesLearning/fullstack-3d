# 主入口 Nginx 配置（放到 /etc/nginx/sites-available/default）
server {
    listen 80 default_server;
    server_name _;

    # 引入 3D 项目的独立子路由配置
    include /opt/fullstack-3d-prod/nginx.location.conf;

    # 如果另一个主项目也拆分了子路由，可取消下面注释引入：
    # include /opt/main-app/nginx.location.conf;

    # 主框架默认入口（如果主项目跑在 8000 端口）
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
